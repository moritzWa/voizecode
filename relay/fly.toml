# Fly.io config — ONE always-on machine. The relay keeps sessions/sockets in memory,
# so it must never scale horizontally or auto-stop (that's why it left Deno Deploy).
app = "voizecode-relay"
primary_region = "sjc"

# Deploy from the repo root: `flyctl deploy --config relay/fly.toml .`
# main.ts imports ../shared/*.ts, so the build context has to include shared/ as well as relay/.
# The path is relative to THIS file, not to the build context — "relay/Dockerfile" resolves to
# relay/relay/Dockerfile and fails.
[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
