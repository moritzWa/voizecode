# Fly.io config for the web client. Stateless — but kept always-on so the phone
# never waits on a cold start mid-demo.
app = "voizecode-web"
primary_region = "sjc"

[http_service]
  internal_port = 3030
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
