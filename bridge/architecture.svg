<title id="title">AgentVoice system architecture</title><desc id="desc">One component diagram showing iPhone ChatGPT, a cloud MCP backend with Postgres context and outbox, the Mac connector and local OpenCode SQLite inbox, and a separate locally encrypted backup pipeline to R2. All sync and backup services are proposed.</desc><defs>
