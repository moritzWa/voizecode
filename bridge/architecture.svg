<text x="28" y="50" font-size="30" fill="#243247" font-weight="650" text-anchor="start">AgentVoice: what runs where, and what moves</text>
<text x="28" y="82" font-size="18" fill="#243247" font-weight="650" text-anchor="start">Offline chat history comes from the cloud chat copy. No Mac waking. Backups are optional recovery only.</text>
<text x="28" y="110" font-size="16" fill="#64748b" font-weight="400" text-anchor="start">PROPOSED. Only the synthetic MCP probe exists; read-only iPhone voice is confirmed.</text>
