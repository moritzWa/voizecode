<title id="title">AgentVoice: program boundaries and data movement</title><desc id="desc">Proposed architecture. Agent View contains a dashboard process and a background bridge process in the same binary. Its bridge reads SQLite changes, uploads approved rows, polls the cloud backend and submits pending messages to OpenCode. External backup helpers encrypt a full baseline and changed pages before uploading to R2. Arrowheads show data movement, not which component initiates requests.</desc><defs>
<marker id="2563eb" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#2563eb"/></marker>
